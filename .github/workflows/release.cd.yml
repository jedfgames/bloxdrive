name: Release / CD

on:
  push:
    branches:
      - release

jobs:
  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Build plugin
        run: ./Scripts/BuildPlugin.exec.luau

      - name: Get version and changelog
        id: version
        run: ./Submodules/luau-cicd/Scripts/GetReleaseInfo.exec.luau

      - name: Create git tag
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./Submodules/luau-cicd/Scripts/CreateGitTag.exec.luau "$VERSION_TAG"

      - name: Publish to Wally
        continue-on-error: true
        env:
          WALLY_AUTH: ${{ secrets.WALLY_AUTH }}
        run: ./Submodules/luau-cicd/Scripts/PublishToWally.exec.luau

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./Submodules/luau-cicd/Scripts/CreateGitHubRelease.exec.luau "$VERSION_TAG" "$NOTES_FILE" Build/Bloxdrive.rbxm
