name: Release / CI

on:
  pull_request:
    branches:
      - release
    types: [opened, edited, reopened, synchronize]

jobs:
  verify-wally-auth:
    name: verify-wally-auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check WALLY_AUTH secret
        env:
          WALLY_AUTH: ${{ secrets.WALLY_AUTH }}
        run: ./Submodules/luau-cicd/Scripts/CheckWallyAuth.exec.luau

  validate-pr-title:
    name: validate-pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./Submodules/luau-cicd/Scripts/CheckReleaseTitle.exec.luau "$TITLE"

  verify-diff-matches-main:
    name: verify-diff-matches-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check diff with main
        run: ./Submodules/luau-cicd/Scripts/CheckDiffWithMain.exec.luau

  check-formatting:
    name: check-formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting
        run: ./Submodules/luau-cicd/Scripts/CheckFormatting.exec.luau

  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Run tests
        run: ./Scripts/RunTests.exec.luau

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Setup Lune typedefs
        run: lune setup

      - name: Run static analysis
        run: ./Submodules/luau-cicd/Scripts/RunStaticAnalysis.exec.luau roblox

  check-json-format:
    name: check-json-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check JSON format
        run: ./Submodules/luau-cicd/Scripts/CheckJsonFormat.exec.luau

  validate-version:
    name: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check version update
        run: ./Submodules/luau-cicd/Scripts/EnsureProperVersionUpdate.exec.luau

      - name: Check version match
        run: ./Submodules/luau-cicd/Scripts/CheckVersionMatch.exec.luau

      - name: Check changelog entry
        run: ./Submodules/luau-cicd/Scripts/CheckChangelogVersion.exec.luau

      - name: Check changelog format
        run: ./Submodules/luau-cicd/Scripts/CheckChangelogFormat.exec.luau

      - name: Verify PR title matches VERSION
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./Submodules/luau-cicd/Scripts/CheckReleaseTitleVersion.exec.luau "$TITLE"
